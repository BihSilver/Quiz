<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Diagnóstico de Estilo de Liderança</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page">

  <div class="brand">
    <h1>Diagnóstico de Estilo de Liderança</h1>
    <p>5 perguntas rápidas sobre como você conduz sua equipe no dia a dia.</p>
  </div>

  <!-- Etapa 0: nome -->
  <div id="step-name" class="card">
    <div class="field">
      <label for="input-name">Como podemos te chamar?</label>
      <input id="input-name" type="text" placeholder="Seu nome" autocomplete="off" />
    </div>
    <button id="btn-start" class="btn-primary" disabled>Começar</button>
  </div>

  <!-- Etapa 1: perguntas -->
  <div id="step-quiz" class="hidden" style="width:100%; max-width:560px;">
    <div class="progress-track" id="progress-track"></div>
    <div class="card">
      <div class="question-label" id="question-label"></div>
      <div class="question-text" id="question-text"></div>
      <div class="options" id="options"></div>
    </div>
  </div>

  <!-- Etapa 2: resultado -->
  <div id="step-result" class="hidden card">
    <div class="result-badge" id="result-badge">
      <span class="dot" id="result-dot"></span>
      <span id="result-tagline"></span>
    </div>
    <div class="result-title" id="result-title"></div>
    <p id="result-description"></p>
  </div>

  <div id="status-msg" style="max-width:560px; width:100%; margin-top:14px; font-size:13px; color:var(--text-muted);"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="quiz-data.js"></script>
<script src="quiz.js"></script>
</body>
</html>
